name: Build App
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Generate native Android code
        run: npx expo prebuild --platform android --clean

      - name: Start EAS build (async)
        id: eas_build
        run: |
          echo "Starting EAS build..."
          eas build --platform android --profile preview --non-interactive --no-wait

      - name: Verify EAS project configuration
        run: |
          echo "Checking EAS configuration..."
          eas build:list --platform android --limit 1 || echo "Could not list builds"

      - name: Show build info
        run: |
          echo ""
          echo "========================================"
          echo "✅ EAS Build job submitted successfully!"
          echo "📱 Monitor your build at:"
          echo "   https://expo.dev/accounts/ustchope/projects/FundTracker/builds"
          echo ""
          echo "Your APK will be available for download once the build completes."
          echo "========================================"
