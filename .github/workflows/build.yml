name: Build App
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Generate native Android code
        run: npx expo prebuild --platform android --clean

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK with Gradle
        id: gradle_build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1
          echo "=== Checking build output ==="
          find . -name "*.apk" -type f 2>/dev/null
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug APK directory not found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fundtracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
