name: Build App
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install EAS CLI
        run: npm install -g eas-cli
      
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: Generate native Android code
        run: npx expo prebuild --platform android --clean
      
      - name: Build Android APK
        id: android-build
        run: |
          eas build --platform android --profile preview --non-interactive 2>&1 | tee /tmp/eas_output.txt
          echo "build_id=$(cat /tmp/eas_output.txt | grep -oP 'https://expo.dev/accounts/[^/]+/projects/[^/]+/builds/\K[a-f0-9-]+' | head -1)" >> $GITHUB_OUTPUT
      
      - name: Wait for Android build to complete
        if: steps.android-build.outputs.build_id != ''
        run: |
          build_id="${{ steps.android-build.outputs.build_id }}"
          echo "Waiting for build $build_id to complete..."
          for i in {1..60}; do
            status=$(eas build:view $build_id --json 2>/dev/null | grep -oP '"status":"\K[^"]+' | head -1)
            echo "Build status: $status"
            if [ "$status" == "finished" ]; then
              echo "Build completed successfully!"
              eas build:view $build_id --json | grep -oP '"artifactUrl":"\K[^"]+' | head -1
              exit 0
            elif [ "$status" == "errored" ]; then
              echo "Build failed!"
              eas build:view $build_id --json
              exit 1
            fi
            sleep 30
          done
          echo "Build timed out"
          exit 1
      
      - name: Show Android build result
        run: |
          build_id="${{ steps.android-build.outputs.build_id }}"
          if [ -n "$build_id" ]; then
            echo "📱 Android Build ID: $build_id"
            echo "🔗 View build at: https://expo.dev/accounts/ustchope/projects/FundTracker/builds/$build_id"
          fi
      
      - name: Build iOS
        run: |
          echo "iOS build skipped - requires Apple Developer account"
          echo "To build iOS, add Apple credentials to EAS secrets"
