name: Build App
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Generate native Android code
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK with Gradle
        id: gradle_build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          echo "BUILD_LOG=$(cat build.log | tail -100)" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Show build log excerpt
        if: failure()
        run: |
          echo "=== Last 50 lines of build log ==="
          tail -50 android/app/build/outputs/logs/manifest-merger-debug-report.txt 2>/dev/null || echo "No log file found"
          echo ""
          echo "=== Gradle errors ==="
          grep -A5 -i "error\|fail\|exception" android/app/build/outputs/logs/*.txt 2>/dev/null || echo "No error details found"
