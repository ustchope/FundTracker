name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android APK (Debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fund-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload APK to releases
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show success message
        if: success()
        run: |
          echo ""
          echo "========================================"
          echo "✅ APK 构建成功！"
          echo "📱 APK 文件: android/app/build/outputs/apk/debug/app-debug.apk"
          echo ""
          echo "💡 下一步："
          echo "   1. 点击上方 Artifacts 下载 APK"
          echo "   2. 将 APK 传到手机安装"
          echo "   3. 如果提示安全警告，需在设置中允许未知来源安装"
          echo "========================================"
